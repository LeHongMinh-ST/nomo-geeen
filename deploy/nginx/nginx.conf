events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=30r/m;

    upstream nomogreen_backend { server backend:3001; }
    upstream nomogreen_frontend { server frontend:3000; }

    server {
        listen 80;

        location = /auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass http://nomogreen_backend;
            include /etc/nginx/proxy_params;
        }

        location = /auth/refresh {
            limit_req zone=auth_refresh burst=10 nodelay;
            proxy_pass http://nomogreen_backend;
            include /etc/nginx/proxy_params;
        }

        # Metrics stay on the backend network; scrape backend:3001 with X-Metrics-Token.
        location = /metrics { return 404; }

        location ~ ^/(auth|tenant|admin|health)(/|$) {
            proxy_pass http://nomogreen_backend;
            include /etc/nginx/proxy_params;
        }

        location / {
            proxy_pass http://nomogreen_frontend;
            include /etc/nginx/proxy_params;
        }
    }
}
